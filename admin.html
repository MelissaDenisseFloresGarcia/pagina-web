<style>
    :root{
        --fondo:#fdfbfb;--rosa-bebe:#ffe5ec;--rosa-activo:#ffb3c6;
        --rojo-pastel:#ff4d6d;--rojo-oscuro:#c9184a;--texto:#590d22;
        --blanco:#ffffff;--negro:#1a1a1a;--gris-borde:#ececec;--gris-suave:#f7f5f5;
        --verde:#25d366;--amarillo:#ffc107;--rojo:#dc3545;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background-color:var(--fondo);color:var(--texto);padding-bottom:40px;}

    /* LOGIN */
    .login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#fff8f9,#ffe5ec);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
    .login-screen.hidden{display:none;}
    .login-box{background:var(--blanco);padding:40px 30px;border-radius:20px;box-shadow:0 20px 60px rgba(201,24,74,0.15);width:100%;max-width:400px;text-align:center;}
    .login-box h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--negro);letter-spacing:2px;margin-bottom:8px;}
    .login-box p{font-size:12px;color:#999;margin-bottom:28px;letter-spacing:1px;text-transform:uppercase;}
    .login-box input{width:100%;border:1.5px solid var(--gris-borde);border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:16px;outline:none;transition:border-color 0.2s ease;}
    .login-box input:focus{border-color:var(--rosa-activo);}
    .login-box button{width:100%;background:var(--negro);color:var(--blanco);border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;}
    .login-box button:hover{background:#000;}
    .login-error{color:var(--rojo);font-size:12px;margin-top:12px;display:none;}

    /* HEADER */
    .admin-topbar{background:var(--blanco);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gris-borde);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px;}
    .admin-topbar h1{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--negro);letter-spacing:1.5px;}
    .admin-topbar h1 span{font-size:11px;color:var(--rojo-pastel);letter-spacing:2px;text-transform:uppercase;display:block;font-family:'Poppins',sans-serif;font-weight:500;margin-top:2px;}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap;}
    .admin-btn{background:var(--blanco);border:1.5px solid var(--gris-borde);padding:9px 18px;border-radius:22px;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s ease;color:var(--negro);}
    .admin-btn:hover{background:var(--rosa-bebe);border-color:var(--rosa-activo);}
    .admin-btn.active{background:var(--negro);color:var(--blanco);border-color:var(--negro);}
    .admin-btn.salir{background:var(--rojo-pastel);color:var(--blanco);border-color:var(--rojo-pastel);}

    .admin-container{max-width:1100px;margin:0 auto;padding:24px;}

    .tab-panel{display:none;}
    .tab-panel.visible{display:block;}

    .section-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--negro);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--gris-borde);display:flex;justify-content:space-between;align-items:center;}
    .section-title .count{font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;color:#999;}

    /* PEDIDO CARD */
    .pedido-card{background:var(--blanco);border:1px solid var(--gris-borde);border-radius:14px;padding:18px;margin-bottom:14px;transition:box-shadow 0.2s ease;}
    .pedido-card:hover{box-shadow:0 6px 20px rgba(0,0,0,0.05);}
    .pedido-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
    .pedido-info{flex:1;min-width:0;}
    .pedido-nombre{font-size:15px;font-weight:600;color:var(--negro);margin-bottom:4px;}
    .pedido-contacto{font-size:12px;color:#666;}
    .pedido-contacto a{color:var(--rojo-oscuro);text-decoration:none;font-weight:500;}
    .pedido-fecha{font-size:11px;color:#999;margin-top:4px;}
    .pedido-estado{font-size:10px;font-weight:600;padding:4px 12px;border-radius:12px;letter-spacing:1px;text-transform:uppercase;height:fit-content;}
    .estado-pendiente{background:#fff3cd;color:#856404;}
    .estado-confirmado{background:#d4edda;color:#155724;}
    .estado-cancelado{background:#f8d7da;color:#721c24;}

    .pedido-items{background:var(--gris-suave);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
    .pedido-item{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:#444;}
    .pedido-total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:8px;margin-top:6px;border-top:1px dashed var(--gris-borde);color:var(--negro);}
    .pedido-comentarios{font-size:12px;color:#666;font-style:italic;background:#fffbe6;border-left:3px solid var(--amarillo);padding:8px 12px;border-radius:6px;margin-bottom:12px;}

    .pedido-acciones{display:flex;gap:8px;flex-wrap:wrap;}
    .pedido-acciones button{border:none;border-radius:10px;padding:10px 18px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all 0.2s ease;letter-spacing:0.5px;}
    .btn-confirmar{background:var(--verde);color:white;}
    .btn-confirmar:hover{background:#1ebe5b;}
    .btn-cancelar{background:var(--rojo);color:white;}
    .btn-cancelar:hover{background:#c82333;}
    .btn-eliminar{background:transparent;color:#999;border:1.5px solid var(--gris-borde);}
    .btn-eliminar:hover{background:#f0f0f0;color:var(--rojo);}
    .pedido-acciones button:disabled{opacity:0.4;cursor:not-allowed;}

    .empty-state{text-align:center;padding:60px 20px;color:#999;font-size:13px;font-style:italic;}

    /* INVENTARIO */
    .inventario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
    .inv-card{background:var(--blanco);border:1px solid var(--gris-borde);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;}
    .inv-img{width:60px;height:60px;border-radius:10px;background:var(--rosa-bebe);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .inv-img img{max-width:80%;max-height:80%;object-fit:contain;}
    .inv-info{flex:1;min-width:0;}
    .inv-nombre{font-size:12px;font-weight:500;color:#2b2b2b;margin-bottom:6px;line-height:1.3;}
    .inv-control{display:flex;align-items:center;gap:8px;}
    .inv-control button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gris-borde);background:var(--blanco);cursor:pointer;font-size:16px;font-weight:600;color:var(--negro);display:flex;align-items:center;justify-content:center;line-height:1;}
    .inv-control button:hover{background:var(--rosa-bebe);}
    .inv-stock{font-size:16px;font-weight:700;min-width:32px;text-align:center;color:var(--negro);}
    .inv-stock.agotado{color:var(--rojo);}

    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--negro);color:white;padding:14px 24px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform 0.4s ease;z-index:2000;}
    .toast.show{transform:translateX(-50%) translateY(0);}

    @media(max-width:640px){
        .admin-topbar{padding:12px 16px;}
        .admin-topbar h1{font-size:20px;}
        .admin-container{padding:16px;}
        .inventario-grid{grid-template-columns:1fr;}
    }
</style>
</head>

        </div>

        <div class="tab-panel" id="tab-inventario">

    </div>
</div>

let stock = {};
let pedidos = {};

// LOGIN
window.intentarLogin = function(){
    const pass = document.getElementById('passInput').value;
    if(pass === PASSWORD){
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').style.display = 'block';
        sessionStorage.setItem('sabella_admin', 'ok');
        iniciarEscucha();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
};

window.salir = function(){
    sessionStorage.removeItem('sabella_admin');
    location.reload();
};

// Si ya está logueado
if(sessionStorage.getItem('sabella_admin') === 'ok'){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').style.display = 'block';
    iniciarEscucha();
}

function iniciarEscucha(){
    onValue(ref(db, 'stock'), snap => {
        stock = snap.val() || {};
        renderInventario();
    });
    onValue(ref(db, 'pedidos'), snap => {
        pedidos = snap.val() || {};
        renderPedidos();
    });
}

function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2500);
}

/* ============================
   PEDIDOS
============================ */
function renderPedidos(){
    const pendientes = [];
    const confirmados = [];
    const cancelados = [];

    Object.keys(pedidos).forEach(k=>{
        const p = {...pedidos[k], _key: k};
        if(p.estado === 'pendiente') pendientes.push(p);
        else if(p.estado === 'confirmado') confirmados.push(p);
        else if(p.estado === 'cancelado') cancelados.push(p);
    });

    pendientes.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
    confirmados.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
    cancelados.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));

    document.getElementById('countPendientes').textContent = pendientes.length;
    document.getElementById('countConfirmados').textContent = confirmados.length;
    document.getElementById('countCancelados').textContent = cancelados.length;

    document.getElementById('listaPendientes').innerHTML = pendientes.length === 0 
        ? '<div class="empty-state">No hay pedidos pendientes</div>'
        : pendientes.map(p => renderPedidoCard(p, 'pendiente')).join('');
    
    document.getElementById('listaConfirmados').innerHTML = confirmados.length === 0
        ? '<div class="empty-state">Sin pedidos confirmados</div>'
        : confirmados.map(p => renderPedidoCard(p, 'confirmado')).join('');

    document.getElementById('listaCancelados').innerHTML = cancelados.length === 0
        ? '<div class="empty-state">Sin pedidos cancelados</div>'
        : cancelados.map(p => renderPedidoCard(p, 'cancelado')).join('');
}

function renderPedidoCard(p, tipo){
    const fecha = new Date(p.fecha);
    const fechaStr = fecha.toLocaleDateString('es-MX', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
    const itemsHTML = p.items.map(it=>`<div class="pedido-item"><span>${it.nombre} (x${it.cantidad})</span><span>$${it.precio * it.cantidad}</span></div>`).join('');
    const comentariosHTML = p.comentarios ? `<div class="pedido-comentarios">"${p.comentarios}"</div>` : '';
    
    let accionesHTML = '';
    if(tipo === 'pendiente'){
        accionesHTML = `
            <div class="pedido-acciones">
                <button class="btn-confirmar" onclick="confirmarPedido('${p._key}')">Confirmar venta</button>
                <button class="btn-cancelar" onclick="cancelarPedido('${p._key}')">Cancelar</button>
                <button class="btn-eliminar" onclick="eliminarPedido('${p._key}')">Eliminar</button>
            </div>
        `;
    } else {
        accionesHTML = `
            <div class="pedido-acciones">
                <button class="btn-eliminar" onclick="eliminarPedido('${p._key}')">Eliminar del historial</button>
            </div>
        `;
    }

    return `
        <div class="pedido-card">
            <div class="pedido-header">
                <div class="pedido-info">
                    <div class="pedido-nombre">${p.nombre}</div>
                    <div class="pedido-contacto">Celular: <a href="https://wa.me/${p.celular.replace(/\D/g,'')}" target="_blank">${p.celular}</a></div>
                    <div class="pedido-fecha">${fechaStr}</div>
                </div>
                <div class="pedido-estado estado-${tipo}">${tipo}</div>
            </div>
            <div class="pedido-items">
                ${itemsHTML}
                <div class="pedido-total"><span>TOTAL</span><span>$${p.total}</span></div>
            </div>
            ${comentariosHTML}
            ${accionesHTML}
        </div>
    `;
}

window.confirmarPedido = async function(key){
    if(!confirm('¿Confirmar esta venta? Se descontará el stock automáticamente.')) return;
    const p = pedidos[key];
    if(!p) return;

    try {
        // Descontar stock de cada item
        for(const it of p.items){
            const stockRef = ref(db, 'stock/' + it.id);
            await runTransaction(stockRef, (current) => {
                if(current === null || current === undefined) return 0;
                return Math.max(0, current - it.cantidad);
            });
        }
        // Marcar pedido como confirmado
        await update(ref(db, 'pedidos/' + key), { estado: 'confirmado', fechaConfirmacion: new Date().toISOString() });
        toast('Venta confirmada. Stock actualizado.');
    } catch(err) {
        console.error(err);
        toast('Error al confirmar la venta.');
    }
};

window.cancelarPedido = async function(key){
    if(!confirm('¿Cancelar este pedido?')) return;
    try {
        await update(ref(db, 'pedidos/' + key), { estado: 'cancelado', fechaCancelacion: new Date().toISOString() });
        toast('Pedido cancelado.');
    } catch(err) {
        console.error(err);
        toast('Error al cancelar.');
    }
};

window.eliminarPedido = async function(key){
    if(!confirm('¿Eliminar este pedido del historial?')) return;
    try {
        await remove(ref(db, 'pedidos/' + key));
        toast('Pedido eliminado.');
    } catch(err) {
        console.error(err);
        toast('Error al eliminar.');
    }
};

/* ============================
   INVENTARIO
============================ */
function renderInventario(){
    const grid = document.getElementById('inventarioGrid');
    document.getElementById('countInventario').textContent = PRODUCTOS.length + ' productos';
    
    grid.innerHTML = PRODUCTOS.map(p => {
        const s = stock[p.id] !== undefined ? stock[p.id] : 0;
        const agotadoClass = s === 0 ? 'agotado' : '';
        return `
            <div class="inv-card">
                <div class="inv-img"><img src="${p.img}" alt=""></div>
                <div class="inv-info">
                    <div class="inv-nombre">${p.nombre}</div>
                    <div class="inv-control">
                        <button onclick="cambiarStock('${p.id}', -1)">−</button>
                        <span class="inv-stock ${agotadoClass}">${s}</span>
                        <button onclick="cambiarStock('${p.id}', 1)">+</button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

window.cambiarStock = async function(id, delta){
    const stockRef = ref(db, 'stock/' + id);
    try {
        await runTransaction(stockRef, (current) => {
            const val = (current === null || current === undefined) ? 0 : current;
            return Math.max(0, val + delta);
        });
        toast('Stock actualizado');
    } catch(err) {
        console.error(err);
        toast('Error al actualizar stock');
    }
};

/* ============================
   TABS
============================ */
window.cambiarTab = function(tab, event){
    document.querySelectorAll('.admin-btn[data-tab]').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('visible'));
    document.getElementById('tab-' + tab).classList.add('visible');
};
