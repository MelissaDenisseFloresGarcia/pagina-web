<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabella - Makeup & Skincare</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root{
        --fondo:#fdfbfb;
        --rosa-bebe:#ffe5ec;
        --rosa-activo:#ffb3c6;
        --rojo-pastel:#ff4d6d;
        --rojo-oscuro:#c9184a;
        --texto:#590d22;
        --blanco:#ffffff;
        --negro:#1a1a1a;
        --gris-borde:#ececec;
        --gris-suave:#f7f5f5;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{
        background-color:var(--fondo);
        color:var(--texto);
        padding-bottom:90px;
        overflow-x:hidden;
    }

    /* HEADER */
    .topbar{
        background-color:var(--fondo);
        padding:14px 24px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:16px;
        border-bottom:1px solid var(--gris-borde);
        position:sticky;
        top:0;
        z-index:100;
    }
    .header-left{
        display:flex;
        align-items:center;
        gap:14px;
        min-width:0;
        flex-shrink:0;
    }
    .header-logo{
        width:52px;
        height:52px;
        object-fit:cover;
        border-radius:50%;
        flex-shrink:0;
        border:2px solid var(--rosa-bebe);
        box-shadow:0 4px 14px rgba(201,24,74,0.1);
        background:var(--blanco);
    }
    .header-brand{
        display:flex;
        flex-direction:column;
        line-height:1;
    }
    .topbar h1{
        font-family:'Cormorant Garamond', serif;
        font-size:28px;
        font-weight:700;
        color:var(--negro);
        letter-spacing:1.5px;
        white-space:nowrap;
    }
    .header-tagline{
        font-size:8.5px;
        font-weight:500;
        letter-spacing:3.5px;
        color:var(--rojo-pastel);
        text-transform:uppercase;
        margin-top:4px;
        padding-left:2px;
    }
    .search-box{
        flex:1;
        max-width:440px;
        background-color:var(--blanco);
        border:1px solid var(--gris-borde);
        border-radius:26px;
        padding:11px 18px;
        display:flex;
        align-items:center;
        gap:10px;
        font-size:13px;
        color:#999;
        transition:border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-box:focus-within{
        border-color:var(--rosa-activo);
        box-shadow:0 0 0 3px rgba(255,179,198,0.25);
    }
    .search-box input{
        border:none;
        background:transparent;
        outline:none;
        flex:1;
        font-size:13px;
        color:var(--negro);
    }
    .search-box input::placeholder{color:#b8b8b8;}

    .btn-cart-top{
        background:var(--blanco);
        border:1px solid var(--gris-borde);
        cursor:pointer;
        position:relative;
        padding:10px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius:50%;
        width:46px;
        height:46px;
        transition:all 0.2s ease;
    }
    .btn-cart-top:hover{
        background:var(--rosa-bebe);
        border-color:var(--rosa-activo);
    }
    .btn-cart-top svg{width:22px;height:22px;stroke:var(--negro);}
    .btn-cart-top .badge-top{
        position:absolute;
        top:-2px;
        right:-2px;
        background-color:var(--rojo-pastel);
        color:white;
        font-size:10px;
        font-weight:600;
        padding:2px 6px;
        border-radius:10px;
        min-width:20px;
        text-align:center;
        border:2px solid var(--fondo);
    }

    /* CATEGORÍAS */
    .nav-cats{
        display:flex;
        overflow-x:auto;
        gap:10px;
        padding:18px 24px;
        background-color:var(--fondo);
        border-bottom:1px solid var(--gris-borde);
        white-space:nowrap;
        -webkit-overflow-scrolling:touch;
        position:sticky;
        top:82px;
        z-index:99;
        justify-content:center;
    }
    .nav-cats::-webkit-scrollbar{display:none;}
    @media(max-width:768px){.nav-cats{justify-content:flex-start;}}

    .cat-btn{
        background-color:var(--blanco);
        border:1.5px solid var(--gris-borde);
        padding:11px 24px;
        border-radius:26px;
        font-size:13px;
        font-weight:500;
        color:var(--negro);
        cursor:pointer;
        transition:all 0.25s ease;
        flex-shrink:0;
        letter-spacing:0.3px;
    }
    .cat-btn.active{
        background-color:var(--rosa-activo);
        border-color:var(--rosa-activo);
        color:var(--negro);
        font-weight:600;
        box-shadow:0 4px 14px rgba(255,179,198,0.4);
    }
    .cat-btn:hover:not(.active){
        background-color:var(--rosa-bebe);
        border-color:var(--rosa-bebe);
        transform:translateY(-1px);
    }

    /* GRID */
    .container{max-width:1400px;margin:0 auto;padding:20px 24px 10px;}
    .productos-grid{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:16px;
        padding-bottom:24px;
    }
    @media(min-width:640px){.productos-grid{grid-template-columns:repeat(3,1fr);}}
    @media(min-width:1024px){.productos-grid{grid-template-columns:repeat(4,1fr);gap:20px;}}
    @media(min-width:1400px){.productos-grid{grid-template-columns:repeat(5,1fr);}}

    .producto-card{
        background:var(--blanco);
        border:1px solid var(--gris-borde);
        border-radius:16px;
        overflow:hidden;
        display:flex;
        flex-direction:column;
        transition:box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
        cursor:pointer;
    }
    .producto-card:hover{
        box-shadow:0 12px 30px rgba(201,24,74,0.09);
        transform:translateY(-3px);
        border-color:var(--rosa-bebe);
    }
    .producto-img-wrap{
        background-color:var(--rosa-bebe);
        aspect-ratio:1/1;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
        position:relative;
    }
    .producto-img-wrap img{width:80%;height:80%;object-fit:contain;}
    .producto-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;}
    .producto-nombre{
        font-size:12.5px;
        font-weight:500;
        color:#2b2b2b;
        line-height:1.35;
        min-height:34px;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
    }
    .producto-cat-tag{
        font-size:9px;
        color:#a17b8a;
        text-transform:uppercase;
        letter-spacing:1px;
        margin-top:-2px;
        font-weight:500;
    }
    .producto-bottom{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:8px;
    }
    .producto-precio{font-size:16px;font-weight:700;color:var(--negro);}

    .btn-add-round{
        width:36px;
        height:36px;
        border-radius:50%;
        border:1.5px solid var(--negro);
        background:var(--blanco);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        transition:all 0.2s ease;
    }
    .btn-add-round:hover{background:var(--negro);}
    .btn-add-round:hover svg{stroke:var(--blanco);}
    .btn-add-round svg{width:16px;height:16px;stroke:var(--negro);}

    .cantidad-control{
        display:flex;
        align-items:center;
        border:1.5px solid var(--gris-borde);
        border-radius:24px;
        padding:3px;
        gap:4px;
        background:var(--blanco);
    }
    .cantidad-control button{
        width:28px;height:28px;border-radius:50%;border:none;background:transparent;
        cursor:pointer;display:flex;align-items:center;justify-content:center;
        transition:background 0.2s ease;
    }
    .cantidad-control button:hover{background:var(--rosa-bebe);}
    .cantidad-control svg{width:14px;height:14px;stroke:var(--negro);}
    .cantidad-control span{
        font-size:12.5px;font-weight:600;min-width:20px;
        text-align:center;color:var(--negro);
    }

    /* CARRITO */
    .carrito-overlay{
        position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:998;
        opacity:0;visibility:hidden;
        transition:opacity 0.35s ease, visibility 0.35s ease;
    }
    .carrito-overlay.open{opacity:1;visibility:visible;}
    .carrito-sidebar{
        position:fixed;top:0;right:0;width:100%;max-width:420px;height:100vh;
        background:var(--blanco);z-index:999;transform:translateX(100%);
        transition:transform 0.4s cubic-bezier(0.25,0.8,0.25,1);
        display:flex;flex-direction:column;
    }
    .carrito-sidebar.open{transform:translateX(0);}
    .carrito-header{
        padding:18px 20px;display:flex;align-items:center;gap:14px;
        border-bottom:1px solid var(--gris-borde);
    }
    .carrito-header .btn-back{
        background:transparent;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;
    }
    .carrito-header .btn-back svg{width:20px;height:20px;stroke:var(--negro);}
    .carrito-header h2{font-size:17px;font-weight:600;color:var(--negro);flex:1;}

    .carrito-vaciar-link{text-align:right;padding:8px 20px 0;}
    .carrito-vaciar-link button{
        background:transparent;border:none;color:var(--rojo-oscuro);
        font-size:12px;text-decoration:underline;cursor:pointer;font-weight:500;
    }
    .carrito-body{flex:1;overflow-y:auto;padding:14px 20px 20px;}
    .carrito-item{
        display:flex;gap:12px;padding:14px 0;
        border-bottom:1px solid var(--gris-borde);align-items:center;
    }
    .carrito-item:last-child{border-bottom:none;}
    .carrito-item-img{
        width:70px;height:70px;border-radius:10px;background:var(--rosa-bebe);
        display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
    }
    .carrito-item-img img{width:80%;height:80%;object-fit:contain;}
    .carrito-item-info{flex:1;min-width:0;}
    .carrito-item-nombre{font-size:12px;font-weight:400;color:#3a3a3a;margin-bottom:6px;line-height:1.3;}
    .carrito-item-precio{font-size:14px;font-weight:600;color:var(--negro);}
    .carrito-item-controls{
        display:flex;align-items:center;gap:4px;
        border:1.5px solid var(--gris-borde);border-radius:20px;padding:2px;
    }
    .carrito-item-controls button{
        width:24px;height:24px;border-radius:50%;border:none;background:transparent;
        cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .carrito-item-controls button:hover{background:var(--rosa-bebe);}
    .carrito-item-controls svg{width:12px;height:12px;stroke:var(--negro);}
    .carrito-item-controls span{font-size:12px;font-weight:500;min-width:16px;text-align:center;}

    .carrito-vacio{
        flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:center;padding:40px 20px;text-align:center;
    }
    .carrito-vacio svg{width:60px;height:60px;stroke:var(--negro);margin-bottom:20px;stroke-width:1.5;}
    .carrito-vacio h3{font-size:18px;font-weight:600;color:var(--negro);margin-bottom:8px;}
    .carrito-vacio p{font-size:12px;color:#666;line-height:1.5;}

    .carrito-footer{
        padding:14px 20px 20px;border-top:1px solid var(--gris-borde);background:var(--blanco);
    }
    .btn-checkout{
        width:100%;background-color:var(--negro);color:var(--blanco);border:none;
        border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;
        align-items:center;font-size:14px;font-weight:500;cursor:pointer;
        transition:all 0.25s ease;
    }
    .btn-checkout:hover{background-color:#000;}
    .btn-checkout-left{display:flex;align-items:center;gap:12px;}
    .btn-checkout .count-badge{
        background:rgba(255,255,255,0.15);border-radius:6px;
        padding:3px 10px;font-size:13px;font-weight:600;
    }
    .btn-checkout-right{display:flex;align-items:center;gap:8px;}
    .btn-checkout svg{width:16px;height:16px;stroke:var(--blanco);}

    /* PANTALLA WHATSAPP CON FORMULARIO */
    .whatsapp-screen{
        position:fixed;inset:0;background:var(--blanco);z-index:1001;
        display:none;flex-direction:column;
        overflow-y:auto;
    }
    .whatsapp-screen.open{display:flex;}
    .whatsapp-header{
        display:flex;align-items:center;gap:14px;
        padding:20px;border-bottom:1px solid var(--gris-borde);
        position:sticky;top:0;background:var(--blanco);z-index:2;
    }
    .whatsapp-header .btn-back{background:transparent;border:none;cursor:pointer;padding:4px;}
    .whatsapp-header .btn-back svg{width:20px;height:20px;stroke:var(--negro);}
    .whatsapp-header h2{font-size:18px;font-weight:600;color:var(--negro);}

    .whatsapp-body{
        flex:1;
        padding:24px 20px 40px;
        max-width:600px;
        margin:0 auto;
        width:100%;
    }
    .form-group{margin-bottom:18px;}
    .form-group label{
        display:block;
        font-size:12px;
        font-weight:500;
        color:var(--negro);
        margin-bottom:8px;
        letter-spacing:0.3px;
    }
    .form-group label .req{color:var(--rojo-pastel);}
    .form-group input,
    .form-group textarea{
        width:100%;
        border:1.5px solid var(--gris-borde);
        border-radius:12px;
        padding:14px 16px;
        font-size:14px;
        font-family:'Poppins',sans-serif;
        color:var(--negro);
        background:var(--blanco);
        outline:none;
        transition:border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group textarea{
        resize:vertical;
        min-height:90px;
        line-height:1.5;
    }
    .form-group input:focus,
    .form-group textarea:focus{
        border-color:var(--rosa-activo);
        box-shadow:0 0 0 3px rgba(255,179,198,0.25);
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder{color:#b8b8b8;}

    .resumen-pedido{
        background:var(--gris-suave);
        border-radius:14px;
        padding:16px 18px;
        margin-bottom:20px;
        border:1px solid var(--gris-borde);
    }
    .resumen-pedido h3{
        font-size:12px;
        font-weight:600;
        color:var(--negro);
        margin-bottom:10px;
        letter-spacing:0.5px;
        text-transform:uppercase;
    }
    .resumen-item{
        display:flex;
        justify-content:space-between;
        font-size:12px;
        color:#555;
        padding:4px 0;
    }
    .resumen-total{
        display:flex;
        justify-content:space-between;
        font-size:14px;
        font-weight:700;
        color:var(--negro);
        padding-top:10px;
        margin-top:8px;
        border-top:1px dashed var(--gris-borde);
    }

    .btn-enviar-whatsapp{
        width:100%;
        background-color:#25d366;
        color:white;
        border:none;
        border-radius:14px;
        padding:18px;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        letter-spacing:0.5px;
        transition:all 0.25s ease;
        box-shadow:0 6px 20px rgba(37,211,102,0.3);
    }
    .btn-enviar-whatsapp:hover{
        background-color:#1ebe5b;
        transform:translateY(-2px);
        box-shadow:0 8px 24px rgba(37,211,102,0.45);
    }
    .btn-enviar-whatsapp svg{width:22px;height:22px;fill:white;}

    /* FAB WHATSAPP */
    .fab-cart{
        position:fixed;bottom:20px;right:20px;width:56px;height:56px;
        border-radius:50%;background-color:#25d366;border:none;
        box-shadow:0 6px 20px rgba(37,211,102,0.4);cursor:pointer;
        display:none;align-items:center;justify-content:center;z-index:900;
    }
    .fab-cart svg{width:26px;height:26px;fill:white;}

    .seccion-cat{display:none;}
    .seccion-cat.visible{display:block;}

    /* MODAL PRODUCTO */
    .modal-producto{
        position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;
        display:none;align-items:flex-end;justify-content:center;
    }
    .modal-producto.open{display:flex;}
    @media(min-width:640px){.modal-producto{align-items:center;}}
    .modal-content{
        background:var(--blanco);width:100%;max-width:500px;max-height:92vh;
        border-radius:20px 20px 0 0;overflow-y:auto;position:relative;
        animation:slideUp 0.4s ease;
    }
    @media(min-width:640px){.modal-content{border-radius:20px;max-height:90vh;}}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .modal-close{
        position:absolute;top:14px;right:14px;width:34px;height:34px;
        border-radius:50%;background:var(--blanco);border:1px solid var(--gris-borde);
        cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;
    }
    .modal-close svg{width:16px;height:16px;stroke:var(--negro);}
    .modal-img{
        width:100%;aspect-ratio:1/1;background:var(--rosa-bebe);
        display:flex;align-items:center;justify-content:center;padding:30px;
    }
    .modal-img img{max-width:80%;max-height:80%;object-fit:contain;}
    .modal-body{padding:20px;}
    .modal-nombre{font-size:18px;font-weight:600;color:var(--negro);margin-bottom:6px;line-height:1.3;}
    .modal-precio{font-size:22px;font-weight:600;color:var(--negro);margin-bottom:14px;}
    .modal-descripcion{
        font-size:13px;
        font-weight:400;
        color:#555;
        line-height:1.6;
        margin-bottom:20px;
        padding:14px 16px;
        background:var(--gris-suave);
        border-radius:12px;
        border-left:3px solid var(--rosa-activo);
    }
    .modal-actions{display:flex;gap:10px;align-items:center;}
    .modal-actions .cantidad-control{padding:5px;border-width:1.5px;}
    .modal-actions .cantidad-control button{width:32px;height:32px;}
    .modal-actions .cantidad-control svg{width:16px;height:16px;}
    .modal-actions .cantidad-control span{font-size:14px;min-width:22px;}
    .modal-btn-add{
        flex:1;background:var(--negro);color:var(--blanco);border:none;
        border-radius:12px;padding:14px;font-size:14px;font-weight:500;
        cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    }
    .modal-btn-add svg{width:16px;height:16px;stroke:var(--blanco);}

    @media(max-width:640px){
        .topbar{padding:12px 16px;gap:10px;}
        .header-logo{width:44px;height:44px;}
        .topbar h1{font-size:22px;}
        .header-tagline{font-size:7.5px;letter-spacing:3px;}
        .search-box{padding:9px 14px;font-size:12px;}
        .search-box input{font-size:12px;}
        .btn-cart-top{width:42px;height:42px;padding:8px;}
        .btn-cart-top svg{width:20px;height:20px;}
        .nav-cats{padding:14px 16px;top:76px;gap:8px;}
        .cat-btn{padding:9px 18px;font-size:12px;}
        .container{padding:16px 16px 10px;}
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="header-left">
        <img src="logoprincipal.jpeg" alt="Sabella" class="header-logo" onerror="this.style.display='none'">
        <div class="header-brand">
            <h1>Sabella</h1>
            <div class="header-tagline">Makeup & Skincare</div>
        </div>
    </div>
    <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Buscar producto">
    </div>
    <button class="btn-cart-top" onclick="abrirCarrito()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="badge-top" id="badgeTop">0</span>
    </button>
</div>

<div class="nav-cats">
    <button class="cat-btn active" onclick="filtrar('todos', event)">Ver todos</button>
    <button class="cat-btn" onclick="filtrar('labios', event)">Labios</button>
    <button class="cat-btn" onclick="filtrar('rostro', event)">Rostro</button>
    <button class="cat-btn" onclick="filtrar('ojos', event)">Ojos</button>
    <button class="cat-btn" onclick="filtrar('skincare', event)">Skincare</button>
    <button class="cat-btn" onclick="filtrar('herramientas', event)">Herramientas</button>
</div>

<div class="container">
    <div class="seccion-cat visible" data-cat="todos"><div class="productos-grid" id="grid-todos"></div></div>
    <div class="seccion-cat" data-cat="labios"><div class="productos-grid" id="grid-labios"></div></div>
    <div class="seccion-cat" data-cat="rostro"><div class="productos-grid" id="grid-rostro"></div></div>

const CAT_LABEL = {labios:'Labios',rostro:'Rostro',ojos:'Ojos',skincare:'Skincare',herramientas:'Herramientas'};

let carrito = {};
let modalProducto = null;
let modalCantidad = 1;

function renderizarProductos(){
    renderGrid('grid-todos', PRODUCTOS, true);
    renderGrid('grid-labios', PRODUCTOS.filter(p=>p.cat==='labios'), false);
    renderGrid('grid-rostro', PRODUCTOS.filter(p=>p.cat==='rostro'), false);
    renderGrid('grid-ojos', PRODUCTOS.filter(p=>p.cat==='ojos'), false);
    renderGrid('grid-skincare', PRODUCTOS.filter(p=>p.cat==='skincare'), false);
    renderGrid('grid-herramientas', PRODUCTOS.filter(p=>p.cat==='herramientas'), false);
}

function renderGrid(gridId, productos, mostrarCat){
    const grid = document.getElementById(gridId);
    if(!grid) return;
    grid.innerHTML = '';
    productos.forEach(p=>grid.appendChild(crearCard(p, mostrarCat)));
}

function crearCard(p, mostrarCat){
    const card = document.createElement('div');
    card.className = 'producto-card';
    const cant = carrito[p.id] || 0;

    let footerHTML;
    if(cant > 0){
        footerHTML = `
            <div class="cantidad-control">
                <button onclick="event.stopPropagation();restar('${p.id}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 12h14"/></svg>
                </button>
                <span>${cant}</span>
                <button onclick="event.stopPropagation();sumar('${p.id}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
        `;
    } else {
        footerHTML = `
            <button class="btn-add-round" onclick="event.stopPropagation();sumar('${p.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        `;
    }

    const catTagHTML = mostrarCat ? `<div class="producto-cat-tag">${CAT_LABEL[p.cat] || p.cat}</div>` : '';

    card.innerHTML = `
        <div class="producto-img-wrap">
            <img src="${p.img}" alt="${p.nombre}" loading="lazy">
        </div>
        <div class="producto-body">
            <div class="producto-nombre">${p.nombre}</div>
            ${catTagHTML}
            <div class="producto-bottom">
                <div class="producto-precio">$${p.precio}</div>
                ${footerHTML}
            </div>
        </div>
    `;

    card.addEventListener('click', ()=>abrirModal(p.id));
    return card;
}

function sumar(id){carrito[id] = (carrito[id]||0)+1; refrescar();}
function restar(id){
    if(!carrito[id]) return;
    carrito[id]--;
    if(carrito[id] <= 0) delete carrito[id];
    refrescar();
}
function vaciarCarrito(){
    if(Object.keys(carrito).length === 0) return;
    if(confirm('¿Vaciar el carrito?')){
        carrito = {};
        refrescar();
    }
}

function refrescar(){
    renderizarProductos();
    const totalItems = Object.values(carrito).reduce((a,b)=>a+b,0);
    document.getElementById('badgeTop').textContent = totalItems;
    document.getElementById('badgeTop').style.display = totalItems > 0 ? 'block' : 'none';
    renderizarCarrito();
    document.getElementById('fabWhats').style.display = totalItems > 0 ? 'flex' : 'none';
}

function renderizarCarrito(){
    const cont = document.getElementById('carritoContenido');
    const ids = Object.keys(carrito);

    if(ids.length === 0){
        cont.innerHTML = `
            <div class="carrito-vacio">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <h3>Tu carrito está vacío</h3>
                <p>Agrega algunos productos para comenzar.</p>
            </div>
        `;
        return;
    }

    let total = 0;
    let itemsHTML = '<div class="carrito-vaciar-link"><button onclick="vaciarCarrito()">Vaciar Carrito</button></div>';
    itemsHTML += '<div class="carrito-body">';

    ids.forEach(id=>{
        const p = PRODUCTOS.find(x=>x.id===id);
        const cant = carrito[id];
        total += p.precio * cant;
        itemsHTML += `
            <div class="carrito-item">
                <div class="carrito-item-img"><img src="${p.img}" alt=""></div>
                <div class="carrito-item-info">
                    <div class="carrito-item-nombre">${p.nombre}</div>
                    <div class="carrito-item-precio">$${p.precio}</div>
                </div>
                <div class="carrito-item-controls">
                    <button onclick="restar('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 12h14"/></svg></button>
                    <span>${cant}</span>
                    <button onclick="sumar('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
            </div>
        `;
    });
    itemsHTML += '</div>';

    const totalItems = Object.values(carrito).reduce((a,b)=>a+b,0);
    itemsHTML += `
        <div class="carrito-footer">
            <button class="btn-checkout" onclick="abrirWhatsAppScreen()">
                <div class="btn-checkout-left">
                    <span class="count-badge">${totalItems}</span>
                    <span>Agregar</span>
                </div>
                <div class="btn-checkout-right">
                    <span>$${total}</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                </div>
            </button>
        </div>
    `;

    cont.innerHTML = itemsHTML;
}

function abrirCarrito(){
    document.getElementById('carritoBar').classList.add('open');
    document.getElementById('carritoOverlay').classList.add('open');
}
function cerrarCarrito(){
    document.getElementById('carritoBar').classList.remove('open');
    document.getElementById('carritoOverlay').classList.remove('open');
}

function abrirModal(id){
    const p = PRODUCTOS.find(x=>x.id===id);
    if(!p) return;
    modalProducto = p;
    modalCantidad = carrito[p.id] || 1;
    document.getElementById('modalImg').src = p.img;
    document.getElementById('modalNombre').textContent = p.nombre;
    document.getElementById('modalPrecio').textContent = '$' + p.precio;
    document.getElementById('modalDescripcion').textContent = p.desc || 'Sin descripción disponible.';
    document.getElementById('modalCantidad').textContent = modalCantidad;
    document.getElementById('modalTotal').textContent = '$' + (p.precio * modalCantidad);
    document.getElementById('modalProducto').classList.add('open');
}
function cerrarModal(){
    document.getElementById('modalProducto').classList.remove('open');
    modalProducto = null;
}
function cambiarCantidadModal(delta){
    modalCantidad = Math.max(1, modalCantidad + delta);
    document.getElementById('modalCantidad').textContent = modalCantidad;
    document.getElementById('modalTotal').textContent = '$' + (modalProducto.precio * modalCantidad);
}
function agregarDesdeModal(){
    if(!modalProducto) return;
    carrito[modalProducto.id] = (carrito[modalProducto.id]||0) + modalCantidad;
    cerrarModal();
    refrescar();
}

/* PANTALLA WHATSAPP CON FORMULARIO */
function abrirWhatsAppScreen(){
    if(Object.keys(carrito).length === 0) return;

    const resumenDiv = document.getElementById('resumenItems');
    let total = 0;
    let resumenHTML = '';
    Object.keys(carrito).forEach(id=>{
        const p = PRODUCTOS.find(x=>x.id===id);
        const cant = carrito[id];
        const subtotal = p.precio * cant;
        total += subtotal;
        resumenHTML += `<div class="resumen-item"><span>${p.nombre} (x${cant})</span><span>$${subtotal}</span></div>`;
    });
    resumenDiv.innerHTML = resumenHTML;
    document.getElementById('resumenTotal').textContent = '$' + total;

    document.getElementById('whatsappScreen').classList.add('open');
}
function cerrarWhatsApp(){
    document.getElementById('whatsappScreen').classList.remove('open');
}

function enviarWhatsApp(){
    const nombre = document.getElementById('clienteNombre').value.trim();
    const celular = document.getElementById('clienteCelular').value.trim();
    const comentarios = document.getElementById('clienteComentarios').value.trim();

    if(!nombre){
        alert('Por favor escribe tu nombre para continuar.');
        document.getElementById('clienteNombre').focus();
        return;
    }

    if(!celular){
        alert('Por favor escribe tu número de celular para continuar.');
        document.getElementById('clienteCelular').focus();
        return;
    }

    let mensaje = 'Hola! Me gustaría hacer un pedido%0A';
    mensaje += `*Nombre:* ${encodeURIComponent(nombre)}%0A`;
    mensaje += `*Celular:* ${encodeURIComponent(celular)}%0A`;
    mensaje += `*Comentarios:* ${encodeURIComponent(comentarios || 'Ninguno')}%0A%0A`;

    let total = 0;
    Object.keys(carrito).forEach(id=>{
        const p = PRODUCTOS.find(x=>x.id===id);
        const cant = carrito[id];
        total += p.precio * cant;
        mensaje += `*${p.nombre} (x${cant})*%0A`;
    });
    mensaje += `%0A*TOTAL: $${total}*`;

    window.open(`https://wa.me/52449128289?text=${mensaje}`, '_blank');
}

function filtrar(cat, event){
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.seccion-cat').forEach(sec=>{
        if(sec.dataset.cat === cat){
            sec.classList.add('visible');
        } else {
            sec.classList.remove('visible');
        }
    });
}

renderizarProductos();
refrescar();
</script>
